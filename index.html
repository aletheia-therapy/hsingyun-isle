<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星雲之島：AI 人間佛教探索與實踐平台</title>
<meta name="description" content="走進星雲大師的智慧，讓佛法在生活中實踐。一座可以探索、學習、與 AI 對話，並把三好四給帶回生活的數位島嶼。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="src/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="星雲之島：東方山水小島的 3D 地圖。點地點，旅人會沿著步道走過去。"></canvas>
  <div id="pins" class="pins" aria-hidden="true"></div>

  <!-- ============ 首頁 ============ -->
  <section id="home" class="home" aria-labelledby="home-title">
    <div class="home-inner">
      <p class="home-eyebrow">FO GUANG WISDOM ISLAND</p>
      <h1 id="home-title" class="home-title">星雲之島</h1>
      <p class="home-sub">AI 人間佛教探索與實踐平台</p>
      <p class="home-lede">走進大師的智慧，讓佛法在生活中實踐。<br>沿著島上的步道，認識星雲大師的一生、理解人間佛教，和 AI 學習助理對話，在七座亭子裡練習三好四給，最後帶一張願行卡回到生活。</p>
      <div class="home-actions">
        <button type="button" id="enter-btn" class="btn btn-primary btn-lg">進入島嶼</button>
        <button type="button" id="home-ai" class="btn btn-ghost btn-lg"><span class="ai-dot" aria-hidden="true"></span>AI 智慧導覽</button>
      </div>
      <div class="home-links">
        <button type="button" class="link-btn" data-open="guide">探索指南</button>
        <span aria-hidden="true">・</span>
        <button type="button" class="link-btn" data-open="about">關於本作品</button>
      </div>
      <ol class="home-path" aria-label="學習路徑">
        <li><b>探索</b><span>生命之路</span></li>
        <li><b>學習</b><span>智慧之境</span></li>
        <li><b>實踐</b><span>善念實踐園</span></li>
        <li><b>對話</b><span>AI 智慧講堂</span></li>
        <li><b>願行</b><span>願行之境</span></li>
      </ol>
      <p class="home-note">本作品為獨立創作的數位教育平台，不代表佛光山或佛光大學官方製作或授權。</p>
    </div>
  </section>

  <!-- ============ 島上介面 ============ -->
  <header class="brand">
    <button type="button" id="home-btn" class="brand-home" aria-label="返回首頁">
      <span class="brand-title">星雲之島</span>
      <span class="brand-sub">返回首頁</span>
    </button>
  </header>

  <nav id="places" class="places" aria-label="島上五大區域">
    <div class="places-head">
      <span class="places-title">探索地圖</span>
      <span class="places-progress"><b id="progress">0</b> / <span id="progress-total">13</span></span>
    </div>
    <div class="progress-bar" aria-hidden="true"><i id="progress-fill"></i></div>
    <div id="zone-list" class="zone-list"></div>
    <p class="places-foot">點清單或地圖上的標記，旅人會沿著步道走過去。</p>
  </nav>

  <div id="hint" class="hint" role="status"></div>

  <button type="button" id="ai-fab" class="ai-fab" aria-label="開啟 AI 導覽">
    <span class="ai-fab-orb" aria-hidden="true"></span>
    <span class="ai-fab-text">AI 導覽</span>
  </button>

  <aside id="card" class="card" role="dialog" aria-label="地點內容" hidden></aside>
  <aside id="chat-drawer" class="drawer" role="dialog" aria-label="AI 導覽" hidden></aside>

  <!-- 指南與關於 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="icon-btn modal-close" aria-label="關閉">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="loading" class="loading" role="status"><span class="loading-dot"></span>島嶼浮現中……</div>
  <section id="error" class="error" role="alert" hidden>
    <h2>島嶼無法顯示</h2>
    <p id="error-msg"></p>
    <button type="button" class="btn btn-primary" onclick="location.reload()">重新載入</button>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
